<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan — Simpel-Pay</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root{
  color-scheme:light;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --text:#1d1d1f;--muted:#6e6e73;--accent:#0a7aff;--green:#28c840;--orange:#ff9f0a;--red:#ff453a;--purple:#af52de;
  --glass:rgba(255,255,255,.72);--card:rgba(255,255,255,.88);--line:rgba(0,0,0,.1);--bar:rgba(255,255,255,.6);--track:rgba(120,120,128,.16);
  --wall:linear-gradient(135deg,#9cbcff 0%,#c4b0fb 40%,#f9c4de 72%,#fde3bd 100%);
  --shadow:0 14px 40px rgba(30,30,80,.2),0 0 0 .5px rgba(0,0,0,.14);
}
@media not all{:root{--text:#f5f5f7;--muted:#a1a1a6;--accent:#2f8bff;--glass:rgba(40,40,46,.7);--card:rgba(44,44,50,.86);
  --line:rgba(255,255,255,.12);--bar:rgba(20,20,26,.55);--track:rgba(255,255,255,.14);
  --wall:linear-gradient(135deg,#1e2a5a 0%,#3b2a6e 40%,#6b2d5c 75%,#7a4a3a 100%);--shadow:0 14px 40px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.14)}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--wall) fixed;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

/* Navbar */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 20px;padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--bar);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;min-width:0}
.sch-logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;overflow:hidden;
  background:linear-gradient(160deg,#4da3ff,#0a5fe0);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 6px rgba(0,0,0,.22)}
.sch-logo svg{width:20px;height:20px}
.sch-logo img{width:100%;height:100%;object-fit:contain}
.sch-name{display:block;min-width:0;line-height:1.2}
.sch-name b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-name small{display:block;font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.sch-name small{display:none}.sch-name b{font-size:13px}}
.sp{flex:1}
.acct{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 12px;border-radius:99px;background:var(--track)}
.acct div{text-align:right;line-height:1.2}
.acct b{display:block;font-size:13px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acct small{font-size:11px;color:var(--muted)}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(160deg,#4da3ff,#7c3aed);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* Layout */
.wrap{max-width:none;margin:0;padding:22px min(150px,12vw)}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;margin-bottom:18px}
h1{font-size:clamp(26px,4.5vw,36px);letter-spacing:-.025em;line-height:1.1}
.head p{color:var(--muted);font-size:14px;margin-top:4px}
.chip{font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;background:var(--glass);box-shadow:0 0 0 .5px var(--line)}
.panel{background:var(--glass);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-radius:16px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.stat{padding:16px}
.stat .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;margin-bottom:10px}
.stat .ic svg{width:18px;height:18px}
.stat small{color:var(--muted);font-size:13px}
.stat b{display:block;font-size:clamp(20px,2.6vw,26px);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-weight:600}.up{color:#1fa23c}.mid{color:#b86e00}
@media not all{.up{color:#5be37a}.mid{color:#ffb454}}
.box{padding:20px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ph .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.ph .ic svg{width:18px;height:18px}
.ph h2{font-size:18px;letter-spacing:-.01em;line-height:1.2}
.cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);background:var(--track);padding:3px 10px;border-radius:99px}
.tw{overflow-x:auto;border-radius:12px;box-shadow:inset 0 0 0 .5px var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:1500px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:11px 14px;background:rgba(120,120,128,.1);border-bottom:.5px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:.5px solid var(--line);vertical-align:middle}
tbody tr:hover{background:rgba(10,122,255,.06)}tbody tr:last-child td{border-bottom:0}
.r{text-align:right}.nw{white-space:nowrap}.num{font-variant-numeric:tabular-nums}
.uraian{min-width:240px;max-width:320px;color:var(--muted)}
.kode{display:inline-block;font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;padding:3px 9px;border-radius:7px;background:var(--track)}
.pct{display:inline-block;font-weight:700;color:#0a62d1;background:rgba(10,122,255,.12);padding:3px 11px;border-radius:99px}
.lihat{font-size:13px;font-weight:600;padding:7px 14px;border-radius:9px;background:var(--accent);color:#fff;white-space:nowrap;transition:background .15s,transform .15s}
.lihat:hover{background:#0062d6}.lihat:active{transform:scale(.96)}
.state{padding:36px 16px;text-align:center;color:var(--muted)}

/* Sticky footer dock */
.dock{position:fixed!important;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:center;padding:0 12px;background:none;border:0;box-shadow:none;pointer-events:none;transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform}
.dock nav{--text:#1d1d1f;--track:rgba(120,120,128,.16);color:var(--text);width:auto;max-width:100%;display:flex;justify-content:center;gap:6px;padding:8px 12px;pointer-events:auto;
  background:rgba(255,255,255,.45);backdrop-filter:saturate(180%) blur(28px);-webkit-backdrop-filter:saturate(180%) blur(28px);
  border:.5px solid rgba(255,255,255,.55);border-radius:32px;box-shadow:0 10px 30px rgba(30,30,80,.22),inset 0 1px 0 rgba(255,255,255,.5)}
@media (prefers-color-scheme:dark){.dock nav{--text:#f5f5f7;--track:rgba(255,255,255,.14);background:rgba(40,40,46,.5);border-color:rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)}}
html,body{overflow-x:hidden}
.d{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:92px;padding:8px 14px;border-radius:16px;font-size:12px;font-weight:600;transition:background .15s,transform .15s}
.d:hover{background:var(--track);transform:translateY(-3px)}
.d .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.35)}
.d .ic svg{width:21px;height:21px}

/* Modal detail order */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:rgba(0,0,0,0);visibility:hidden;pointer-events:none;transition:background .3s,visibility 0s linear .3s}
.ov.open{background:rgba(20,20,40,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);visibility:visible;pointer-events:auto;transition:background .3s,visibility 0s}
.mcard{--text:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.1);--track:rgba(120,120,128,.16);color:var(--text);width:min(520px,100%);max-height:calc(100vh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));max-height:calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;background:rgba(255,255,255,.92);border-radius:16px;box-shadow:var(--shadow);padding:20px;opacity:0;transform:translateY(24px) scale(.94);transition:opacity .25s,transform .38s cubic-bezier(.2,.9,.25,1.15)}
.ov.open .mcard{opacity:1;transform:none}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:14px}
.dl dt{color:var(--muted)}.dl dd{font-weight:500;word-break:break-word}
.mfoot{display:flex;justify-content:flex-end;margin-top:18px}
.btn{font-size:14px;font-weight:600;padding:9px 18px;min-height:40px;border-radius:10px;background:var(--track)}
.btn:hover{background:rgba(120,120,128,.28)}

/* Form pembayaran */
.mcard.w{width:min(900px,100%)}
.mcard h2.mt{font-size:18px;letter-spacing:-.01em;margin-bottom:14px}
.fg2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.fg2 .full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}label i{color:var(--red);font-style:normal}
.in{width:100%;font:inherit;font-size:14px;color:var(--text);padding:9px 11px;min-height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.95);box-shadow:0 0 0 .5px var(--line),inset 0 1px 2px rgba(0,0,0,.06);transition:box-shadow .15s}
.in:focus{outline:0;box-shadow:0 0 0 3px rgba(10,122,255,.4),0 0 0 1px var(--accent)}
.in.bad{box-shadow:0 0 0 2px var(--red)}.in[readonly]{background:var(--track);color:var(--muted);cursor:not-allowed}
textarea.in{resize:vertical;min-height:72px;line-height:1.45}
.hint{font-size:12px;color:var(--muted);margin-top:4px}.errm{font-size:12px;color:var(--red);margin-top:6px;display:none}.errm.show{display:block}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}.sec h3{font-size:15px}
.btn.sm{min-height:34px;padding:6px 14px;font-size:13px}.btn.blue{background:var(--accent);color:#fff}.btn.blue:hover{background:#0062d6}.btn:disabled{opacity:.6;cursor:progress}
.iw{overflow-x:auto;border-radius:12px;box-shadow:inset 0 0 0 .5px var(--line);padding:10px;background:rgba(255,255,255,.5)}
.ig{min-width:760px}.irow{display:grid;grid-template-columns:52px 1fr 90px 110px 140px 150px 36px;gap:8px;margin-bottom:8px;align-items:center}
.irow.hd{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.irow .no,.irow .i-tot{text-align:right}.irow .no{text-align:center}
.xb{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}.xb:hover{background:var(--track);color:var(--red)}.xb svg{width:17px;height:17px}
.gt{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;font-size:14px}.gt b{font-variant-numeric:tabular-nums}
.mfoot{gap:10px}.mfoot .btn{min-width:92px}
.it{width:100%;border-collapse:collapse;font-size:13px;min-width:0}.it th{padding:8px 10px}.it td{padding:8px 10px}
@media (max-width:640px){.fg2{grid-template-columns:1fr}}

/* Detail order */
.od{padding:0;overflow:auto}
.od>*:not(.od-hd){margin-left:22px;margin-right:22px}
.od-hd{display:flex;align-items:center;gap:12px;padding:18px 22px;margin-bottom:16px;border-bottom:.5px solid var(--line);position:sticky;top:0;z-index:2;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.od-ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#4da3ff,#0a5fe0);box-shadow:0 4px 10px rgba(10,98,224,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.od-ic svg{width:22px;height:22px}
.od-t{min-width:0;flex:1}.od-t small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.od-t h2{font-size:19px;letter-spacing:-.01em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.od-st{flex:none;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px}
.od-st.s{background:rgba(40,200,64,.16);color:#1a8a30}.od-st.p{background:rgba(255,159,10,.18);color:#b86e00}
.od-x{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(120,120,128,.2);color:var(--muted);transition:background .15s}
.od-x:hover{background:rgba(120,120,128,.34);color:var(--text)}.od-x svg{width:16px;height:16px}
.od-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 20px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#4da3ff 0%,#6f5be8 55%,#9b5de5 100%);box-shadow:0 10px 24px rgba(80,70,200,.32),inset 0 1px 0 rgba(255,255,255,.35)}
.od-hero small{display:block;font-size:12px;font-weight:600;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.od-hero b{display:block;font-size:clamp(24px,5vw,32px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.od-tag{font-size:13px;font-weight:700;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4)}
.od-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.oc{padding:11px 14px;border-radius:12px;background:rgba(120,120,128,.09);min-width:0}
.oc small{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.oc b{display:block;font-size:14px;font-weight:600;word-break:break-word}.oc.full{grid-column:1/-1}.oc.full b{font-weight:500;line-height:1.5}
.od-sec{display:flex;align-items:center;gap:10px;margin-top:20px;margin-bottom:10px}.od-sec h3{font-size:15px}.od-sec .cnt{margin-left:0}
.od .it td,.od .it th{padding:10px 12px}.od .it tbody tr:nth-child(even){background:rgba(120,120,128,.05)}
.nb{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;font-size:12px;font-weight:700;background:rgba(10,122,255,.12);color:#0a62d1}
.od .it tfoot td{font-weight:700;background:rgba(10,122,255,.08);border-top:.5px solid var(--line);border-bottom:0}
.od .mfoot{padding-bottom:20px}
@media (max-width:640px){.od-grid{grid-template-columns:repeat(2,1fr)}.od>*:not(.od-hd){margin-left:14px;margin-right:14px}.od-hd{padding:14px}}

/* Dropdown dokumen */
.dd{margin-right:auto}
.ddm{position:fixed;z-index:70;min-width:270px;padding:6px;border-radius:14px;background:rgba(255,255,255,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--shadow);display:none}
.ddm.open{display:block}
.ddm button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:500;color:#1d1d1f}
.ddm button:hover,.ddm button:focus-visible{background:rgba(120,120,128,.16)}
.ddm .n{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(10,122,255,.12);color:#0a62d1}

/* Surat Order */
.sr-card{width:min(880px,100%);padding:0;overflow:auto;max-height:calc(100vh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));max-height:calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.sr-tools{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,.96);border-bottom:.5px solid var(--line)}
.sr-tools b{font-size:16px}.sr-tools .h{flex:1;font-size:12px;color:var(--muted);line-height:1.3}
.sr-paper{margin:16px;background:#fff;color:#000;border:1px solid #000;font:12.5px/1.45 Tahoma,Verdana,"Segoe UI",sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.sr-kop{display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
.sr-kt{flex:1;text-align:center;min-width:0}.sr-kt .b{font-weight:700;font-size:14px;line-height:1.3}.sr-kt .i{font-style:italic;font-size:10.5px;line-height:1.3}.sr-kt .u{font-size:10.5px;text-decoration:underline}
.sr-logo{flex:none;width:60px;height:60px;display:block;overflow:hidden}
.sr-logo img{display:block;width:100%;height:100%;object-fit:contain}
.miss{color:#b3261e;font-style:italic;font-size:11px}
.sr-hr{border:0;border-top:1.5px solid #000;margin:0 12px}
.sr-title{text-align:center;padding:8px 12px 6px;font-size:13px}.sr-title .t{font-weight:700;text-decoration:underline;font-size:13.5px}
.sr-info{padding:2px 12px}.sr-info .rw{display:grid;grid-template-columns:130px 1fr;gap:0 4px;padding:1px 0}
.sr-info .rw>span:last-child{padding-left:2px}
.sr-ln{border-top:1px solid #000;margin:6px 0}
.sr-p{padding:6px 12px 8px}
.sr-t{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;min-width:0;border-top:1px solid #000;border-bottom:1px solid #000}
.sr-t th{font-size:11px;font-weight:700;text-transform:none;letter-spacing:0;color:#000;text-align:center;background:none;border-bottom:1px solid #000;border-left:1px solid #000;padding:3px 6px}
.sr-t td{border:0;border-left:1px solid #000;padding:3px 6px;vertical-align:top;word-break:break-word}
.sr-t th:first-child,.sr-t td:first-child{border-left:0}
.sr-t td.c{text-align:center}
.sr-t tr.fill td{height:200px}
.sr-ttd{margin:10px 12px 14px auto;width:min(300px,70%);text-align:left}
.sr-ttd .sp{height:62px}
.ed{outline:0;display:inline-block;min-width:24px;border-bottom:1px dashed #9db8e6;padding:0 2px;border-radius:2px;transition:background .15s}
.sr-info .ed{display:inline}
.ed:hover{background:#eef5ff}.ed:focus{background:#e3efff;border-bottom-color:#0a7aff}
.ed:empty{background:#fff7d6;border-bottom-color:#e0b100}.ed:empty::before{content:attr(data-ph);color:#a08a2a;font-style:italic;font-weight:400}
.sr-t td .ed{display:block;min-height:1.4em}
@media (max-width:640px){.sr-paper{margin:8px;font-size:11px}.sr-logo{width:44px;height:44px}.sr-info .rw{grid-template-columns:90px 1fr}.sr-tools .h{display:none}}
@media print{
  @page{size:A4;margin:10mm}
  body.ps>*:not(#mSurat){display:none!important}
  body.ps #mSurat{position:static!important;display:block!important;visibility:visible!important;background:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;padding:0!important}
  body.ps #mSurat .sr-card{max-height:none!important;overflow:visible!important;width:auto!important;box-shadow:none!important;background:none!important;opacity:1!important;transform:none!important}
  body.ps .sr-tools{display:none!important}
  body.ps .sr-paper{margin:0;box-shadow:none}
  body.ps .ed{border:0!important;background:none!important}
  body.ps .ed:empty::before{content:""!important}
  body.ps .sr-logo.empty{visibility:hidden}
  body.ps .sr-t{font-size:12px}
  body.ps .sr-t th,body.ps .sr-t td{padding:3px 6px}
  body.ps .sr-t th:last-child,body.ps .sr-t td:last-child{display:table-cell!important}
  body.ps .sr-t tr.fill td{height:300px}
}

/* Toast */
.toast{position:fixed;top:calc(52px + env(safe-area-inset-top));right:14px;z-index:60;max-width:min(340px,calc(100% - 28px));padding:12px 16px;border-radius:14px;background:var(--glass);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:var(--shadow);font-size:14px;transform:translateY(-20px);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.85,.25,1)}
.toast.show{transform:none;opacity:1}

@media (max-width:640px){.stats{grid-template-columns:1fr}}

<script>
/* Ambil logo & nama sekolah dari Supabase untuk navbar */
(function(){
  var SB_URL=window.SIMPELPAY_CONFIG.SUPABASE_URL;
  var SB_KEY=window.SIMPELPAY_CONFIG.SUPABASE_ANON_KEY;
  var CK='simpelpay_nav_sekolah';
  var logoEl=document.getElementById('navLogo'),nameEl=document.getElementById('navName'),subEl=document.getElementById('navSub');
  var dummyLogo=logoEl.innerHTML;
  function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function apply(d){
    if(!d)return;
    if(d.nama)nameEl.textContent=d.nama;
    subEl.textContent=d.sub||'';
    if(d.logo){
      var img=new Image();img.alt='';
      img.onload=function(){logoEl.innerHTML='';logoEl.appendChild(img)};
      img.onerror=function(){logoEl.innerHTML=dummyLogo};
      img.src=d.logo;
    }else{logoEl.innerHTML=dummyLogo}
  }
  try{apply(JSON.parse(localStorage.getItem(CK)||'null'))}catch(e){}
  fetch(SB_URL+'/rest/v1/identitas_sekolah?id=eq.1&select=nama_sekolah,kabupaten,provinsi,logo_url,updated_at',
    {headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}})
    .then(function(r){return r.ok?r.json():Promise.reject(r.status)})
    .then(function(rows){
      var r=rows&&rows[0];if(!r)return;
      var d={nama:r.nama_sekolah,sub:[r.kabupaten,r.provinsi].filter(Boolean).join(', '),
             logo:r.logo_url?r.logo_url+'?v='+encodeURIComponent(r.updated_at||''):''};
      apply(d);
      try{localStorage.setItem(CK,JSON.stringify(d))}catch(e){}
    })
    .catch(function(){});

})();
</script>
<script>
/* Fallback transisi untuk browser tanpa dukungan View Transitions */
(function(){
  var h=document.documentElement;
  if(!h.classList.contains('pt-fb'))return;
  window.addEventListener('pageshow',function(e){if(e.persisted)h.classList.remove('pt-leave')});
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href]');
    if(!a||e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    if(a.target&&a.target!=='_self')return;
    var u=new URL(a.href,location.href);
    if(u.origin!==location.origin||(u.pathname===location.pathname&&u.search===location.search))return;
    if(window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
    e.preventDefault();h.classList.add('pt-leave');
    setTimeout(function(){location.href=a.href},220);
  });
})();
</script>

      rows:r.map(function(o,n){return {

        td:[n+1,'<b>'+esc(o.nomor_order||'—')+'</b>','<span class="kode">'+esc(o.nomor_bku)+'</span>',tgl(o.tanggal),esc(o.nama_toko||'—'),'<span style="color:var(--muted)">'+esc(o.uraian||'—')+'</span>',
          o.file_url?'<span class="bk-ok">✓ Terunggah</span>'+(o.keterangan?' <span style="color:var(--muted);font-size:12px">· '+esc(o.keterangan)+'</span>':''):'<span class="bk-no">Belum ada</span>',aksiFoto(o)],
        c:{t:o.nomor_order,b:o.nomor_bku,s:(o.nama_toko||'—')+(o.uraian?' · '+o.uraian:''),l:'Bukti Photo'+(o.file_url?' · ✓ Terunggah':''),r:tgl(o.tanggal)}}})};
    if(x.k==='kwitansi')return {
      th:['No','Nomor Order','Nomor BKU','Tanggal','Penerima','No. Rekening','Tahun','Jumlah','<span style="display:block;text-align:right">Aksi</span>'],
      rows:r.map(function(o,n){return {
        s:[o.nomor_order,o.nomor_bku,o.penerima,o.no_rekening,o.tahun_anggaran,o.kegiatan,o.file_nama].join(' ').toLowerCase(),
        td:[n+1,'<b>'+esc(o.nomor_order)+'</b>','<span class="kode">'+esc(o.nomor_bku)+'</span>',tgl(o.tanggal),esc(o.penerima),esc(o.no_rekening),esc(o.tahun_anggaran),'Rp '+new Intl.NumberFormat('id-ID').format(o.jumlah||0),aksi(o)],
        c:{t:o.nomor_order,b:o.nomor_bku,s:(o.penerima||'')+(o.kegiatan?' · '+o.kegiatan:''),l:'Rp '+new Intl.NumberFormat('id-ID').format(o.jumlah||0)+(o.file_url?' · PDF ✓':''),r:tgl(o.tanggal)}}})};
    return {th:['No','Nomor Order','Nomor BKU','Tanggal','Nama Toko'],
      rows:r.map(function(o,n){return {
        s:JSON.stringify(o).toLowerCase(),
        td:[n+1,'<b>'+esc(o.nomor_order||'—')+'</b>','<span class="kode">'+esc(o.nomor_bku||o.nomor_bukti||'—')+'</span>',tgl(o.tanggal),esc(o.nama_toko||'—')],
        c:{t:o.nomor_order||x.n+' #'+(o.id||n+1),b:o.nomor_bku||o.nomor_bukti||'',s:o.nama_toko||'',l:x.n,r:tgl(o.tanggal)}}})};
  }

  function aksi(o){
    var up='<button class="lihat'+(o.file_url?' alt':'')+'" type="button" data-up="'+o.id+'">'+(o.file_url?'Ganti':'Upload PDF')+'</button>';
    return '<div class="bk-act">'+(o.file_url?'<a class="lihat" href="'+esc(o.file_url)+'" target="_blank" rel="noopener" title="'+esc(o.file_nama||'')+'">Lihat PDF</a>':'')+up+'</div>';
  }
  function aksiFoto(o){
    var up='<button class="lihat'+(o.file_url?' alt':'')+'" type="button" data-up="'+o.id+'">'+(o.file_url?'Ganti':'Upload Foto')+'</button>';
    return '<div class="bk-act">'+(o.file_url?'<a class="lihat" href="'+esc(o.file_url)+'" target="_blank" rel="noopener">Lihat</a>':'')+up+'</div>';
  }
  var tm;function toast(m){var t=$('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(tm);tm=setTimeout(function(){t.classList.remove('show')},4200)}
  var upId=null,upBusy=false,MAXB=10*1024*1024;
  function jerr(r){return r.text().then(function(x){var m=x;try{var j=JSON.parse(x);m=j.message||j.error||x}catch(e){}console.error('Supabase',r.status,x);throw new Error(m||('HTTP '+r.status))})}
  /* Bukti Photo: file foto (atau PDF) -> bucket aset/foto-kegiatan/<Nomor BKU>.<ext>, lalu dicatat di tabel foto_kegiatan */
  function uploadFoto(file,o){
    var seg=String(o.nomor_bku).replace(/[^A-Za-z0-9._-]/g,'_'),nm=file.name||'',
      isPdf=file.type==='application/pdf'||/\.pdf$/i.test(nm),
      ext=isPdf?'pdf':(/png/i.test(file.type)||/\.png$/i.test(nm)?'png':(/webp/i.test(file.type)||/\.webp$/i.test(nm)?'webp':(/gif/i.test(file.type)||/\.gif$/i.test(nm)?'gif':'jpg'))),
      ctype=isPdf?'application/pdf':(file.type||'image/'+(ext==='jpg'?'jpeg':ext)),
      path='foto-kegiatan/'+seg+'.'+ext,pub=SB_URL+'/storage/v1/object/public/aset/'+path,oldPath=o.file_path,
      A={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
    function J(extra){var h={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};for(var k in extra)h[k]=extra[k];return h}
    upBusy=true;toast('Mengunggah '+nm+'…');
    [].forEach.call(document.querySelectorAll('button[data-up]'),function(b){b.disabled=true});
    fetch(SB_URL+'/storage/v1/object/aset/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':ctype,'x-upsert':'true','cache-control':'max-age=3600'},body:file})
      .then(function(r){return r.ok?r:jerr(r)})
      .then(function(){
        if(o.foto_id)return fetch(SB_URL+'/rest/v1/foto_kegiatan?id=eq.'+o.foto_id,{method:'PATCH',headers:J({Prefer:'return=minimal'}),body:JSON.stringify({path:path,url:pub,keterangan:nm})}).then(function(r){return r.ok?0:jerr(r)});
        return fetch(SB_URL+'/rest/v1/foto_kegiatan',{method:'POST',headers:J({Prefer:'return=representation'}),body:JSON.stringify({nomor_bukti:o.nomor_bku,path:path,url:pub,keterangan:nm})})
          .then(function(r){return r.ok?r.json():jerr(r)}).then(function(a){if(a&&a[0])o.foto_id=a[0].id});
      })
      .then(function(){
        o.file_path=path;o.file_url=pub+'?v='+Date.now();o.keterangan=nm;
        if(oldPath&&oldPath!==path)fetch(SB_URL+'/storage/v1/object/aset/'+oldPath,{method:'DELETE',headers:A}).catch(function(){});
        toast('Bukti photo untuk '+o.nomor_bku+' berhasil diunggah.');
      })
      .catch(function(e){var m=e.message||'';
        toast(/bucket not found/i.test(m)?'Bucket "aset" belum ada. Jalankan supabase-foto-kegiatan.sql dulu.'
          :/could not find the table|schema cache|does not exist/i.test(m)?'Tabel foto_kegiatan belum ada. Jalankan supabase-foto-kegiatan.sql dulu.'
          :/row-level security|violates|unauthorized|not authorized/i.test(m)?'Akses ditolak. Jalankan supabase-foto-kegiatan.sql dulu (izin storage & tabel foto_kegiatan).'
          :/mime|not supported/i.test(m)?'Bucket "aset" tidak mengizinkan jenis file ini. Izinkan image/* dan application/pdf di pengaturan bucket.'
          :/size|exceed|too large/i.test(m)?'Ukuran file melebihi batas bucket "aset".'
          :'Gagal mengunggah: '+m)})
      .then(function(){upBusy=false;draw();drawSp()});
  }
  function upload(file){
    var X=T[upIdx],o=(data[upIdx]||[]).filter(function(x){return x.id==upId})[0];if(!o)return;
    if(X.k==='foto')return uploadFoto(file,o);
    var path=(X.k==='surat'?'surat-order':X.k)+'/'+String(o.nomor_bku).replace(/[^A-Za-z0-9._-]/g,'_')+'.pdf',H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
    upBusy=true;toast('Mengunggah '+file.name+'…');
    var btns=document.querySelectorAll('button[data-up]');[].forEach.call(btns,function(b){b.disabled=true});
    fetch(SB_URL+'/storage/v1/object/aset/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/pdf','x-upsert':'true','cache-control':'max-age=3600'},body:file})
      .then(function(r){return r.ok?r:jerr(r)})
      .then(function(){
        var rec={file_path:path,file_url:SB_URL+'/storage/v1/object/public/aset/'+path+'?v='+Date.now(),file_nama:file.name,file_ukuran:file.size,file_diunggah_at:new Date().toISOString()};
        return fetch(SB_URL+'/rest/v1/'+X.t+'?id=eq.'+o.id,{method:'PATCH',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(rec)})
          .then(function(r){return r.ok?rec:jerr(r)});
      })
      .then(function(rec){for(var k in rec)o[k]=rec[k];toast('PDF untuk '+o.nomor_bku+' berhasil diunggah.')})
      .catch(function(e){var m=e.message||'';
        toast(/bucket not found/i.test(m)?'Bucket "aset" belum ada di Supabase Storage. Jalankan bagian 7 di supabase-surat-order.sql.'
          :/row-level security|violates|unauthorized|not authorized/i.test(m)?'Akses ditolak oleh Storage. Jalankan policy "aset_all" di supabase-surat-order.sql.'
          :/file_path|file_url|column/i.test(m)?(X.k==='tanda'?'Kolom file belum ada di tabel tanda_terima. Jalankan supabase-tanda-terima-file.sql dulu.':'Kolom file belum ada. Jalankan supabase-surat-order.sql dulu.')
          :/mime|not supported/i.test(m)?'Bucket "aset" tidak mengizinkan file PDF. Izinkan application/pdf di pengaturan bucket.'
          :/size|exceed|too large/i.test(m)?'Ukuran file melebihi batas bucket "aset".'
          :'Gagal mengunggah: '+m)})
      .then(function(){upBusy=false;draw();drawSp()});
  }
  $('bkBody').addEventListener('click',function(e){
    var b=e.target.closest('button[data-up]');if(!b||upBusy)return;
    upId=b.dataset.up;upIdx=cur;$('bkFile').value='';$('bkFile').accept=T[cur].k==='foto'?'image/*,application/pdf,.pdf':'application/pdf,.pdf';$('bkFile').click();
  });
  $('spBody').addEventListener('click',function(e){
    var b=e.target.closest('button[data-up]');if(!b||upBusy)return;
    upId=b.dataset.up;upIdx=SP;$('bkFile').value='';$('bkFile').accept='application/pdf,.pdf';$('bkFile').click();
  });
  $('bkFile').addEventListener('change',function(){
    var f=this.files&&this.files[0];if(!f)return;
    var isF=T[upIdx].k==='foto',isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name),isImg=/^image\/(jpeg|png|webp|gif)$/.test(f.type)||/\.(jpe?g|png|webp|gif)$/i.test(f.name);
    if(isF?!(isPdf||isImg):!isPdf){toast(isF?'File harus berupa foto (JPG/PNG/WEBP) atau PDF.':'File harus berformat PDF.');return}
    if(f.size>MAXB){toast('Ukuran file maksimal 10 MB.');return}
    upload(f);
  });

  function draw(){
    var v=view(cur),q=$('bkQ').value.trim().toLowerCase(),head=$('bkHead'),body=$('bkBody'),cards=$('bkCards');
    if(v.loading||v.err){head.innerHTML='';cards.innerHTML='';$('bkMore').textContent='';$('bkCnt').textContent='0 data';
      body.innerHTML='<tr><td class="state">'+(v.err?esc(v.err):'Memuat data…')+'</td></tr>';return}
    var rows=v.rows.filter(function(r){return !q||r.s.indexOf(q)>-1});
    $('bkCnt').textContent=rows.length+' data';
    head.innerHTML='<tr>'+v.th.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr>';
    body.innerHTML=rows.length?rows.map(function(r){return '<tr>'+r.td.map(function(c,i){return '<td class="'+(i===0?'num':'nw')+'">'+c+'</td>'}).join('')+'</tr>'}).join('')
      :'<tr><td colspan="'+v.th.length+'" class="state">'+(q?'Tidak ada hasil untuk "'+esc(q)+'".':'Belum ada data '+esc(T[cur].n)+'.')+'</td></tr>';
    cards.innerHTML=rows.slice(0,6).map(function(r){var c=r.c;return '<div class="bk-card"><div class="t"><b>'+esc(c.t)+'</b>'+(c.b?'<span class="kode">'+esc(c.b)+'</span>':'')+'</div><div class="s">'+esc(c.s||'—')+'</div><div class="m"><span>'+esc(c.l)+'</span><span>'+c.r+'</span></div></div>'}).join('');
    $('bkMore').textContent=rows.length>6?'Menampilkan 6 dari '+rows.length+' data pada kartu; seluruh data ada di tabel.':'';
  }

  function drawSp(){
    var v=view(SP),q=$('spQ').value.trim().toLowerCase(),head=$('spHead'),body=$('spBody');
    if(v.loading||v.err){head.innerHTML='';$('spCnt').textContent='0 data';
      body.innerHTML='<tr><td class="state">'+(v.err?esc(v.err):'Memuat data…')+'</td></tr>';return}
    var rows=v.rows.filter(function(r){return !q||r.s.indexOf(q)>-1});
    $('spCnt').textContent=rows.length+' data';
    head.innerHTML='<tr>'+v.th.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr>';
    body.innerHTML=rows.length?rows.map(function(r){return '<tr>'+r.td.map(function(c,i){return '<td class="'+(i===0?'num':'nw')+'">'+c+'</td>'}).join('')+'</tr>'}).join('')
      :'<tr><td colspan="'+v.th.length+'" class="state">'+(q?'Tidak ada hasil untuk "'+esc(q)+'".':'Belum ada data SPPD.')+'</td></tr>';
  }
  function loadSp(){
    data[SP]=null;drawSp();
    get('sppd','select=*&order=id.desc').then(function(a){data[SP]=a||[]}).catch(function(){data[SP]={err:1}}).then(drawSp);
  }

  function load(i){
    var x=T[i],id=++seq;data[i]=null;draw();
    var p;
    if(x.k==='lengkap'){
      p=get('transaksi_pembayaran','select=id,nomor_order,nomor_bukti,tanggal,nama_toko&order=tanggal.desc,id.desc').then(function(a){
        return Promise.all(DOCT.map(function(d){var f=d.k==='foto';return get(d.t,f?'select=nomor_bukti,url':'select=nomor_bku').then(function(r){return {k:d.k,f:f,r:r}}).catch(function(){return {k:d.k,f:f,r:[]}})})).then(function(all){
          data.set={};all.forEach(function(z){data.set[z.k]={};z.r.forEach(function(o){if(z.f&&!o.url)return;data.set[z.k][String(z.f?o.nomor_bukti:o.nomor_bku).toLowerCase()]=1})});return a});
      });
    }else if(x.k==='foto'){
      p=Promise.all([get('transaksi_pembayaran','select=id,nomor_order,nomor_bukti,tanggal,nama_toko,uraian,penerima&order=tanggal.desc,id.desc'),get('foto_kegiatan','select=*&order=id.desc')]).then(function(z){
        var m={};z[1].forEach(function(f){var k=String(f.nomor_bukti).toLowerCase();if(!m[k])m[k]=f});
        return z[0].map(function(o){var f=m[String(o.nomor_bukti).toLowerCase()];
          return {id:o.id,nomor_order:o.nomor_order,nomor_bku:o.nomor_bukti,tanggal:o.tanggal,nama_toko:o.nama_toko,uraian:o.uraian,penerima:o.penerima,
            foto_id:f?f.id:null,file_path:f?f.path:null,file_url:f?f.url:null,keterangan:f?f.keterangan:null}});
      });
    }else p=get(x.t,'select=*&order=id.desc');
    p.then(function(a){data[i]=a||[]}).catch(function(){data[i]={err:1}}).then(function(){if(i===cur&&id===seq)draw()});
  }
  function pick(i){
    cur=i;[].forEach.call($('bkTabs').children,function(b){var on=+b.dataset.i===i;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});
    load(i);
  }
  var tb=$('bkTabs');
  function arrows(){$('bkPrev').disabled=tb.scrollLeft<=2;$('bkNext').disabled=tb.scrollLeft+tb.clientWidth>=tb.scrollWidth-2}
  $('bkPrev').addEventListener('click',function(){tb.scrollBy({left:-Math.max(160,tb.clientWidth*.6),behavior:'smooth'})});
  $('bkNext').addEventListener('click',function(){tb.scrollBy({left:Math.max(160,tb.clientWidth*.6),behavior:'smooth'})});
  tb.addEventListener('scroll',arrows);window.addEventListener('resize',arrows);setTimeout(arrows,0);
  tb.addEventListener('click',function(e){var b=e.target.closest('.bk-tab');if(b)pick(+b.dataset.i)});
  $('bkTabs').addEventListener('keydown',function(e){
    var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;
    var pos=(TI.indexOf(cur)+d+TI.length)%TI.length;pick(TI[pos]);tb=$('bkTabs');tb.children[pos].focus();tb.children[pos].scrollIntoView({inline:'nearest',block:'nearest'});
  });
  $('bkQ').addEventListener('input',draw);
  $('spQ').addEventListener('input',drawSp);
  document.addEventListener('surat-saved',function(){if(cur===0||T[cur].k==='lengkap')load(cur)});
  pick(0);loadSp();
})();
</script>
</body>
